<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>録画ガジェット</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }
    /* タイトルバーの代わりにカード全体をドラッグ可能にする。
       ボタンやプレビューは drag を無効化してクリックできるようにする。 */
    .card {
      -webkit-app-region: drag;
      box-sizing: border-box;
      width: 100%;
      height: 100vh;
      background: rgba(20, 22, 28, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
      color: #f3f4f6;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .rec-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ef4444;
      margin-right: 6px;
      animation: blink 1.4s infinite;
      vertical-align: middle;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    /* ready（録画前）では点滅ドットを出さず、タイマーも 00:00 のまま */
    .card[data-mode='ready'] .rec-dot { display: none; }
    .card[data-mode='ready'] .time { color: #9ca3af; }
    /* paused（録画停止中・v1.0.10）は点滅しない灰色の四角。経過時間は止めたまま */
    .card[data-mode='paused'] .rec-dot { background: #9ca3af; border-radius: 2px; animation: none; }
    .card[data-mode='paused'] .time { color: #cbd5e1; }
    .head { font-size: 0.8rem; color: #cbd5e1; }
    .close {
      -webkit-app-region: no-drag;
      float: right;
      border: none;
      background: transparent;
      color: #9ca3af;
      font: inherit;
      font-size: 0.9rem;
      cursor: pointer;
      padding: 0 2px;
      line-height: 1;
    }
    .close:hover { color: #f3f4f6; }
    .name {
      max-width: 150px;
      display: inline-block;
      vertical-align: middle;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .time {
      font-variant-numeric: tabular-nums;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .count { font-size: 0.8rem; color: #9ca3af; margin-left: 8px; font-weight: 400; }
    /* 直近6枚のプレビュー（3列×2行、新しい順）。クリックで保存フォルダを開く。 */
    .grid {
      -webkit-app-region: no-drag;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      cursor: pointer;
    }
    .cell {
      aspect-ratio: 16 / 10;
      border-radius: 6px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .opt {
      -webkit-app-region: no-drag;
      font-size: 0.75rem;
      color: #cbd5e1;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .opt input { accent-color: #ef4444; }
    .toggle {
      -webkit-app-region: no-drag;
      cursor: pointer;
      border: none;
      border-radius: 9px;
      padding: 8px 10px;
      font: inherit;
      font-weight: 700;
      color: #fff;
      background: #ef4444;
      transition: background 0.15s;
    }
    .toggle:hover { background: #dc2626; }
    /* ready・paused では緑の「録画開始」「録画再開」ボタンにする */
    .card[data-mode='ready'] .toggle, .card[data-mode='paused'] .toggle { background: #16a34a; }
    .card[data-mode='ready'] .toggle:hover, .card[data-mode='paused'] .toggle:hover { background: #15803d; }
    /* 1枚撮影・取り込みへ進む（v1.0.10・docs/spec-capture-snap-and-import.md） */
    .actions {
      -webkit-app-region: no-drag;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .snap, .finish {
      cursor: pointer;
      border-radius: 9px;
      padding: 7px 8px;
      font: inherit;
      font-size: 0.82rem;
      font-weight: 700;
      color: #fff;
      transition: background 0.15s;
    }
    .snap {
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .snap:hover { background: rgba(255, 255, 255, 0.16); }
    /* 撮影の瞬間に一瞬明るくする（押せたことが分かるように） */
    .snap.flash { background: rgba(255, 255, 255, 0.4); }
    /* 1枚撮影のキー（F9）をキーの形で見せる */
    .kbd {
      display: inline-block;
      min-width: 20px;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 700;
      color: #111827;
      background: #e5e7eb;
      border-bottom: 2px solid #9ca3af;
      line-height: 1.3;
    }
    .finish { border: none; background: #2563eb; }
    .finish:hover { background: #1d4ed8; }
    .finish:disabled { cursor: default; background: rgba(255, 255, 255, 0.08); color: #6b7280; }
    /* 失敗・権限拒否などの警告。撮影できていないことに気づかせる。 */
    .warn {
      -webkit-app-region: no-drag;
      margin-top: 2px;
      padding: 6px 8px;
      border-radius: 8px;
      background: rgba(239, 68, 68, 0.16);
      border: 1px solid rgba(239, 68, 68, 0.55);
      color: #fca5a5;
      font-size: 0.72rem;
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <div class="card" id="card" data-mode="ready">
    <div class="head">
      <span class="rec-dot"></span><span id="label">録画準備</span>
      <span class="name" id="name" title=""></span>
      <button class="close" id="close" title="閉じる（撮った画像があれば、取り込むかどうかを確認します）">✕</button>
    </div>
    <div class="time"><span id="time">00:00</span><span class="count" id="count">0 枚</span></div>
    <div class="grid" id="grid" title="クリックで保存フォルダを開く">
      <div class="cell"><img alt="" hidden /></div>
      <div class="cell"><img alt="" hidden /></div>
      <div class="cell"><img alt="" hidden /></div>
      <div class="cell"><img alt="" hidden /></div>
      <div class="cell"><img alt="" hidden /></div>
      <div class="cell"><img alt="" hidden /></div>
    </div>
    <label class="opt"><input type="checkbox" id="marker" checked />クリック位置を赤で強調する</label>
    <label class="opt"><input type="checkbox" id="drag" />ドラッグを記録する</label>
    <button class="toggle" id="toggle">● 録画開始</button>
    <div class="actions">
      <button class="snap" id="snap" title="マウスのある画面を1枚撮ります。F9 キーでも撮れます（ほかのアプリのメニューを開いたまま撮れます）">📷 1枚撮影 <span class="kbd" id="snapKey">F9</span></button>
      <button class="finish" id="finish" disabled title="撮った画像を手順として取り込みます（ガジェットを閉じて、取り込み画面を開きます）">取り込みへ進む →</button>
    </div>
    <div class="warn" id="warn" hidden></div>
  </div>

  <script>
    (function () {
      'use strict';
      const elCard = document.getElementById('card');
      const elLabel = document.getElementById('label');
      const elName = document.getElementById('name');
      const elTime = document.getElementById('time');
      const elCount = document.getElementById('count');
      const elGrid = document.getElementById('grid');
      const gridImgs = [...elGrid.querySelectorAll('img')];
      const elMarker = document.getElementById('marker');
      const elDrag = document.getElementById('drag');
      const elWarn = document.getElementById('warn');
      const btnToggle = document.getElementById('toggle');
      const btnSnap = document.getElementById('snap');
      const elSnapKey = document.getElementById('snapKey');
      const btnFinish = document.getElementById('finish');
      const btnClose = document.getElementById('close');

      // 直近のプレビュー（新しい順・最大6枚）。7枚目以降は最古を押し出す。
      const previews = [];
      function renderGrid() {
        gridImgs.forEach((img, i) => {
          if (previews[i]) { img.src = previews[i]; img.hidden = false; }
          else { img.removeAttribute('src'); img.hidden = true; }
        });
      }

      // ready = 録画準備（まだ録画していない） / recording = 録画中 /
      // paused = 録画停止中（再開できる・v1.0.10）。1枚撮影はどの状態でも撮れる。
      const LABELS = { ready: '録画準備', recording: '録画中', paused: '録画停止中' };
      const TOGGLES = { ready: '● 録画開始', recording: '■ 録画停止', paused: '● 録画再開' };
      let mode = 'ready';
      let elapsedMs = 0; // 停止までに録画した時間の累計
      let startTime = Date.now(); // 今回の録画開始時刻（録画中だけ使う）
      let count = 0;

      function fmt(ms) {
        const total = Math.floor(ms / 1000);
        const h = Math.floor(total / 3600);
        const m = Math.floor((total % 3600) / 60);
        const s = total % 60;
        const p = (n) => String(n).padStart(2, '0');
        return h > 0 ? `${h}:${p(m)}:${p(s)}` : `${p(m)}:${p(s)}`;
      }
      // 経過時間は録画中だけ進む（停止中は止めた時点のまま）
      function renderTime() {
        const ms = elapsedMs + (mode === 'recording' ? Date.now() - startTime : 0);
        elTime.textContent = fmt(Math.max(0, ms));
      }
      function refreshUI() {
        elCard.dataset.mode = mode;
        elLabel.textContent = LABELS[mode] || LABELS.ready;
        btnToggle.textContent = TOGGLES[mode] || TOGGLES.ready;
        elCount.textContent = `${count} 枚`;
        btnFinish.disabled = count === 0; // 1枚も撮っていなければ取り込めない
        renderTime();
      }
      // main から届く状態 { mode, elapsedMs, startTime } を反映する
      function applyState(d) {
        if (!d) return;
        if (d.mode) mode = d.mode;
        if (typeof d.elapsedMs === 'number') elapsedMs = d.elapsedMs;
        if (typeof d.startTime === 'number') startTime = d.startTime;
        refreshUI();
      }
      setInterval(() => {
        if (mode === 'recording') renderTime();
      }, 250);

      const api = window.recorderAPI;
      if (api) {
        api.onGadgetInit((d) => {
          applyState(d);
          if (d && typeof d.count === 'number') count = d.count;
          if (d && d.name) {
            elName.textContent = d.name;
            elName.title = d.name;
          }
          if (d && d.snapKey) elSnapKey.textContent = d.snapKey;
          if (d && typeof d.markerOn === 'boolean') elMarker.checked = d.markerOn;
          if (d && typeof d.dragOn === 'boolean') elDrag.checked = d.dragOn;
          refreshUI();
        });
        // 本体のツールバーから停止したときなど、ガジェットの外で状態が変わったとき
        if (api.onGadgetState) api.onGadgetState(applyState);
        api.onGadgetUpdate((d) => {
          if (!d) return;
          count = d.count;
          if (d.preview) {
            previews.unshift(d.preview);
            if (previews.length > 6) previews.pop();
            renderGrid();
          }
          refreshUI();
        });
        if (api.onGadgetWarn) {
          api.onGadgetWarn((d) => {
            if (!d || !d.message) return;
            elWarn.textContent = '⚠ ' + d.message;
            elWarn.hidden = false;
          });
        }
        // 録画開始・再開 ⇔ 録画停止。停止してもガジェットは閉じない（v1.0.10）。
        btnToggle.addEventListener('click', async () => {
          // await の間に gadget:state が先に届いて mode が変わり得るので、押した時点の状態で分ける
          const wasRecording = mode === 'recording';
          const r = wasRecording ? await api.pauseRecording() : await api.beginCapture();
          if (!r || !r.ok) return;
          if (wasRecording) {
            applyState({ mode: 'paused', elapsedMs: r.elapsedMs });
          } else {
            applyState({ mode: 'recording', elapsedMs: r.elapsedMs, startTime: r.startTime });
          }
        });
        // 1枚撮影（F9 キーはメインプロセスが直接受ける）。押せたことが分かるよう一瞬光らせる。
        btnSnap.addEventListener('click', async () => {
          const r = await api.snap();
          if (!r || !r.ok) return;
          btnSnap.classList.add('flash');
          setTimeout(() => btnSnap.classList.remove('flash'), 180);
        });
        // 取り込みへ進む: ガジェットを閉じ、本体で取り込み画面を開く（メインプロセス側）
        btnFinish.addEventListener('click', () => {
          btnFinish.disabled = true; // 二度押し防止
          api.finishSession();
        });
        // プレビュー（グリッド）クリックで保存フォルダをエクスプローラーで開く
        elGrid.addEventListener('click', () => api.openShotsDir());
        // クリック位置のハイライト（要素枠／赤丸）ON/OFF
        elMarker.addEventListener('change', () => api.setMarker(elMarker.checked));
        // ドラッグの記録（始点終点2枚・2-R2b ④）ON/OFF。既定 OFF
        elDrag.addEventListener('change', () => api.setDrag(elDrag.checked));
      }
      // ✕: ウインドウを閉じる。撮った画像があれば、メイン側が取り込むかどうかを確認する。
      btnClose.addEventListener('click', () => window.close());
      refreshUI();
    })();
  </script>
</body>
</html>
